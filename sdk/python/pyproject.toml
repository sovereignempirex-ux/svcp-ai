[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svpc-ai"
version = "1.0.0"
description = "A client for the SVPC AI HTTP API."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
# The copy beside this file, not the one at the repository root: a path outside
# the project tree is recorded in the metadata but not copied into the sdist, and
# PyPI rejects a distribution whose metadata names a licence file it does not
# contain.
license-files = ["LICENSE"]
keywords = ["svpc", "ai", "agent", "sdk", "client"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]

# Nothing. A client for a tool that runs commands ought not to drag a dependency
# tree into the program that uses it, and everything here is in the standard
# library.
dependencies = []

[project.urls]
Homepage = "https://github.com/sovereignempirex-ux/svcp-ai#readme"
Repository = "https://github.com/sovereignempirex-ux/svcp-ai.git"
Issues = "https://github.com/sovereignempirex-ux/svcp-ai/issues"

[tool.setuptools]
packages = ["svpc"]
